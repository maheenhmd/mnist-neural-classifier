[project]
name = "mnist-neural-classifier"
version = "0.1.0"
description = "Handwritten digit classification using a PyTorch MLP"
readme = "README.md"
authors = [
    { name = "maheenhmd", email = "maheenhamid27@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "matplotlib>=3.11.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
